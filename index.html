<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrybee Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: #fff;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #218838; }
        .result {
            margin-top: 20px;
            background: #eee;
            padding: 10px;
            border-radius: 4px;
            word-wrap: break-word;
            font-size: 13px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .loading { color: #ff9800; font-weight: bold; }
        .error { color: #dc3545; }
        .success { color: #28a745; }
    </style>
</head>
<body>

<div class="container">
    <h2>Merchant Register</h2>
    
    <label for="num">Phone Number (num)</label>
    <input type="text" id="num" placeholder="e.g. 8801700000000" required>

    <label for="msg">Name & Business Name (msg)</label>
    <input type="text" id="msg" placeholder="e.g. RahimStoreBD" required>

    <button id="submitBtn" onclick="registerMerchant()">Submit</button>

    <div id="resultBox" class="result" style="display:none;"></div>
</div>

<script>
async function registerMerchant() {
    const num = document.getElementById('num').value.trim();
    const msg = document.getElementById('msg').value.trim();
    const resultBox = document.getElementById('resultBox');
    const submitBtn = document.getElementById('submitBtn');

    // Basic Validation
    if (!num || !msg) {
        resultBox.style.display = "block";
        resultBox.className = "result error";
        resultBox.innerHTML = "❌ Missing parameters. Please fill both fields.";
        return;
    }

    // Text split logic (matching your PHP code)
    // Note: JS uses .length (UTF-16 code units), which is mostly fine for English
    // For perfect Unicode matching, you could use Array.from(msg)
    const halfLength = Math.ceil(msg.length / 2);
    const namePart = msg.substring(0, halfLength);
    const businessNamePart = msg.substring(halfLength);

    // Prepare Payload
    const payload = {
        "name": namePart,
        "phone_number": num,
        "business_name": businessNamePart
    };

    // UI Update
    resultBox.style.display = "block";
    resultBox.className = "result loading";
    resultBox.innerHTML = "⏳ Processing, please wait...";
    submitBtn.disabled = true;

    try {
        // Making the API Request
        const response = await fetch('https://api-merchant.carrybee.com/api/v2/merchant/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Origin': 'https://merchant.carrybee.com',
                'x-requested-with': 'mark.via.gp',
                'sec-fetch-site': 'same-site',
                'sec-fetch-mode': 'cors',
                'sec-fetch-dest': 'empty',
                'Referer': 'https://merchant.carrybee.com/'
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        // Display Result
        resultBox.className = "result success";
        resultBox.innerHTML = "<b>✅ Response:</b><br>" + JSON.stringify(data, null, 2);

    } catch (error) {
        // Display Error
        resultBox.className = "result error";
        resultBox.innerHTML = "<b>❌ Network/CORS Error:</b><br>" + error.message + 
                              "<br><br><i>Note: The API server might not allow requests directly from HTML files without a server.</i>";
    } finally {
        submitBtn.disabled = false;
    }
}
</script>

</body>
</html>
